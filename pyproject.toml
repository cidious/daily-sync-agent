[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-sync-agent"
version = "0.1.0"
description = "X11 video chat capture with local transcription and summarization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "httpx>=0.27.0",
    "faster-whisper>=1.0.0",
    "python-xlib>=0.33",
]

[project.scripts]
daily-sync-agent = "daily_sync_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["ruff>=0.4.0"]
